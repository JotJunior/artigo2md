[project]
name = "artigo2md"
version = "0.1.0"
description = "Converte PDFs (artigos científicos, livros, diretrizes) em Markdown, localmente, escolhendo o melhor motor para cada documento."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.40",
    "pypdfium2>=4.30",
    "markitdown[pdf]>=0.1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "ocrmac>=1.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Motor opcional com licença AGPL-3.0 — só instalado se o usuário pedir.
pymupdf = ["pymupdf4llm>=0.0.17"]
# Worker nativo da fila de conversão (`artigo2md worker`). O pika é fixado em 1.5.0 para casar com a licença
# verificada (BSD-3-Clause; docs/specs/conversion-queue/research.md, L15/L16): upgrade exige nova verificação.
queue = ["pika==1.5.0", "psutil"]
dev = ["pytest>=8", "httpx>=0.27", "fpdf2>=2.7", "pyyaml>=6"]

# Dependências mínimas da imagem da API em container (stack/api/Dockerfile): só estes pacotes,
# sem Docling nem motores de conversão. Instalado com `uv sync --frozen --only-group api`.
[dependency-groups]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
artigo2md = "artigo2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artigo2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
