# Infraestrutura local do artigo2md (versão desktop): Postgres, RabbitMQ e API base. A imagem do RabbitMQ
# inclui o painel de gestão, mas este arquivo não publica a 15672: só `stack/compose.management.yaml`, por opt-in.
#
# Use os scripts `stack/up.sh` e `stack/down.sh`; eles validam o `stack/.env` e chamam este arquivo.
# Todas as portas são publicadas SOMENTE em 127.0.0.1 (o endereço é texto fixo aqui, não parametrizável).
# Nenhum serviço usa `restart`: a stack só sobe quando é pedido.
name: artigo2md

services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER em stack/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em stack/.env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB em stack/.env}
    ports:
      - "127.0.0.1:${ARTIGO2MD_POSTGRES_PORT:?defina ARTIGO2MD_POSTGRES_PORT em stack/.env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?defina RABBITMQ_DEFAULT_USER em stack/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?defina RABBITMQ_DEFAULT_PASS em stack/.env}
    ports:
      - "127.0.0.1:${ARTIGO2MD_RABBITMQ_PORT:?defina ARTIGO2MD_RABBITMQ_PORT em stack/.env}:5672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: artigo2md-api:local
    build:
      context: ..
      dockerfile: stack/api/Dockerfile
    user: "10001:10001"
    read_only: true
    # O zip de exportação é gravado em /tmp; a soma de Markdown tem teto de 512 MiB e 768 MiB deixa folga.
    # O tmpfs só ocupa memória enquanto houver arquivo.
    tmpfs:
      - /tmp:size=768m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Único volume do serviço: a pasta de dados do app (onde os workers gravam o Markdown).
    volumes:
      - "${ARTIGO2MD_DATA_DIR:?defina ARTIGO2MD_DATA_DIR em stack/.env}:/data"
    # Portas e hosts abaixo são os do lado de DENTRO da rede do Compose (não as publicadas no seu computador).
    environment:
      ARTIGO2MD_DATA_DIR_HOST: "${ARTIGO2MD_DATA_DIR}"
      ARTIGO2MD_DATA_DIR_MOUNT: "/data"
      ARTIGO2MD_API_ALLOW_DEV_ORIGIN: "${ARTIGO2MD_API_ALLOW_DEV_ORIGIN:-}"
      ARTIGO2MD_POSTGRES_HOST: "postgres"
      ARTIGO2MD_POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?defina POSTGRES_USER em stack/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em stack/.env}"
      POSTGRES_DB: "${POSTGRES_DB:?defina POSTGRES_DB em stack/.env}"
      ARTIGO2MD_RABBITMQ_HOST: "rabbitmq"
      ARTIGO2MD_RABBITMQ_PORT: "5672"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?defina RABBITMQ_DEFAULT_USER em stack/.env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?defina RABBITMQ_DEFAULT_PASS em stack/.env}"
    ports:
      - "127.0.0.1:${ARTIGO2MD_API_PORT:?defina ARTIGO2MD_API_PORT em stack/.env}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client, sys; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/health'); sys.exit(0 if c.getresponse().status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  rabbitmqdata:
